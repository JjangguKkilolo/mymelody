name: Publish Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Test and package a stable release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Only stable vMAJOR.MINOR.PATCH tags may be released.'
          }
          ./scripts/package.ps1 -Version $env:RELEASE_TAG.Substring(1)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-release
          path: artifacts/releases/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-release
          path: release
      - name: Upload all assets to a draft, then publish
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const tag = context.ref.replace('refs/tags/', '');
            if (!/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(tag)) {
              throw new Error('Invalid stable release tag');
            }
            const files = fs.readdirSync('release').filter(name => fs.statSync(path.join('release', name)).isFile());
            if (!files.some(n => n.endsWith('Setup.exe')) || !files.some(n => n.endsWith('Portable.zip')) ||
                !files.includes('releases.win.json') || !files.some(n => n.endsWith('-full.nupkg'))) {
              throw new Error('Release assets are incomplete');
            }
            const body = fs.readFileSync('release/release-notes.md', 'utf8');
            const existing = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            let release = existing.find(r => r.tag_name === tag);
            if (release && !release.draft) throw new Error('This version is already published; create a new version tag.');
            if (!release) {
              release = (await github.rest.repos.createRelease({ ...context.repo, tag_name: tag,
                name: `마이멜로디 연습 친구 ${tag}`, body, draft: true, prerelease: false })).data;
            }
            // Retrying an incomplete draft may replace only that draft's assets, never a published release.
            const oldAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: release.id, per_page: 100
            });
            for (const asset of oldAssets) {
              await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: asset.id });
            }
            for (const name of files) {
              const data = fs.readFileSync(path.join('release', name));
              await github.rest.repos.uploadReleaseAsset({ ...context.repo, release_id: release.id, name, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length } });
            }
            const uploaded = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: release.id, per_page: 100
            });
            for (const name of files) {
              if (!uploaded.some(a => a.name === name && a.state === 'uploaded' && a.size === fs.statSync(path.join('release', name)).size)) {
                throw new Error(`Asset validation failed: ${name}; release remains a draft`);
              }
            }
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, body,
              draft: false, prerelease: false, make_latest: 'true' });
